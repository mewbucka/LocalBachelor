# Alembic configuration for LocalBachelor (roadmap task 1.1).
#
# The database URL is NOT taken from `sqlalchemy.url` when a real
# config.yaml is reachable: alembic/env.py resolves it from config.yaml
# (the single source of truth, roadmap rule 7) via the [app] app_config
# key, so `alembic upgrade head` targets exactly the database the app
# uses. The `sqlalchemy.url` below is only a placeholder fallback for a
# bare run with no config.yaml present.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./local-bachelor.db

# Path to the app bootstrap config, relative to the repo root. env.py
# loads this to resolve the real database path.
[app]
app_config = config.yaml

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
