[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-bachelor"
version = "0.1.0"
description = "Local-first, multi-user RAG research assistant with grounded, citation-validated answers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "trafilatura==2.3.1",
    "pyyaml==6.0.3",
    "pydantic-settings==2.16.1",
    "pygments==2.21.0",
]

[project.optional-dependencies]
# In-process GGUF embedding loader (post-MVP, task 2.10)
gguf = ["llama-cpp-python==0.3.36"]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
    # mypy stubs for PyYAML (app/config.py imports yaml; PyYAML ships no
    # py.typed) — required for `mypy app` in scripts/check.sh to pass.
    "types-PyYAML==6.0.12.20260906",
]

# The repo root is a flat layout with several top-level directories
# (app, alembic, evals, deploy, tests, scripts). Without an explicit
# discovery rule setuptools fails with "Multiple top-level packages
# discovered in a flat-layout". Pin discovery to the importable `app`
# package only; the other directories are not installed.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection calls Depends/Query/Form/... in argument
# defaults; that is the intended pattern, so allow it for B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
