[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-bachelor"
version = "0.1.0"
description = "Local-first, multi-user RAG research assistant with grounded, citation-validated answers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "trafilatura==2.3.1",
    "pyyaml==6.0.3",
    "pydantic-settings==2.16.1",
    "pygments==2.21.0",
]

[project.optional-dependencies]
# In-process GGUF embedding loader (post-MVP, task 2.10)
gguf = ["llama-cpp-python==0.3.36"]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
